version: '3.8'

services:
  webserver:
    restart: unless-stopped
    image: docker.io/library/nginx:latest
    ports:
      - "8080:80"
    networks:
      - recon-network

  ssh:
    restart: unless-stopped
    build:
      dockerfile: ssh.Dockerfile
    ports:
      - "2222:22"
    networks:
      - recon-network

  ftp:
    restart: unless-stopped
    image: stilliard/pure-ftpd:hardened
    environment:
      FTP_USER_NAME: recon_ftp_user
      FTP_USER_PASS: 9QkqOinPZfiuGEFo
    ports:
      - "2100:21"
    networks:
      - recon-network

  database:
    restart: unless-stopped
    image: docker.io/library/mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: kKkszlICX5GRd2JaCwyl
      MYSQL_USER: recon_db_user
    ports:
      - "3306:3306"
    networks:
      - recon-network

  fileserver:
    restart: unless-stopped
    build:
      dockerfile: smb.Dockerfile
    ports:
      - "445:445"
      - "139:139"
    networks:
      - recon-network

  snmp:
    restart: unless-stopped
    build:
      dockerfile: snmp.Dockerfile
    ports:
      - "161:161/udp"
    networks:
      - recon-network

  vulnerable-webserver:
    restart: unless-stopped
    build:
      dockerfile: vuln.Dockerfile
    volumes:
      - /opt/recon/flag:/flag:ro # per-instance flag written by cloud-init
    ports:
      - "17334:80"
    networks:
      - recon-network

networks:
  recon-network:
    driver: bridge
